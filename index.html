<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶龍跳舞中 💃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
            to { text-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 215, 0, 0.6); }
        }

        .stage {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 奶龍本體 */
        .nailong {
            position: relative;
            width: 200px;
            height: 280px;
        }

        /* 頭部 - 黃色 */
        .head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 130px;
            background: linear-gradient(180deg, #FFD93D 0%, #F6C90C 50%, #E8A825 100%);
            border-radius: 75px 75px 60px 60px;
            z-index: 5;
        }

        /* 頭頂小角 */
        .head::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 25px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 25px solid #F6C90C;
            transform: rotate(-15deg);
        }

        .head::after {
            content: '';
            position: absolute;
            top: -20px;
            right: 25px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 25px solid #F6C90C;
            transform: rotate(15deg);
        }

        /* 眼睛 - 綠色 */
        .eyes {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 35px;
        }

        .eye {
            width: 32px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .eye::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 22px;
            background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%);
            border-radius: 50%;
            top: 8px;
            left: 6px;
            animation: lookAround 2s ease-in-out infinite;
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            top: 12px;
            left: 12px;
        }

        @keyframes lookAround {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 鼻子 */
        .nose {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 10px;
            background: #D4A017;
            border-radius: 50%;
        }

        /* 嘴巴 - 微笑 */
        .mouth {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 25px;
            background: #FF6B6B;
            border-radius: 0 0 25px 25px;
            overflow: hidden;
        }

        .mouth::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 12px;
            background: #FF4757;
            border-radius: 0 0 15px 15px;
        }

        /* 臉頰 - 泛紅 */
        .cheek {
            position: absolute;
            top: 55px;
            width: 22px;
            height: 14px;
            background: rgba(255, 150, 150, 0.7);
            border-radius: 50%;
        }

        .cheek.left { left: 10px; }
        .cheek.right { right: 10px; }

        /* 女僕帽 */
        .maid-hat {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .maid-hat::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
            background: #2C2C2C;
            border-radius: 50px 50px 0 0;
        }

        .maid-hat::after {
            content: '';
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 15px;
            background: #fff;
            border-radius: 0 0 10px 10px;
        }

        /* 女僕蝴蝶結 - 黑色 */
        .bowtie {
            position: absolute;
            top: 118px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
        }

        .bowtie::before,
        .bowtie::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 20px;
            background: #1a1a1a;
            border-radius: 50%;
            top: 0;
        }

        .bowtie::before {
            left: -25px;
            transform: rotate(-20deg);
        }

        .bowtie::after {
            right: -25px;
            transform: rotate(20deg);
        }

        .bowtie-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            background: #1a1a1a;
            border-radius: 3px;
        }

        /* 女僕裝身體 */
        .maid-body {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 100px;
            background: #1a1a1a;
            border-radius: 20px 20px 30px 30px;
            z-index: 3;
        }

        /* 女僕裙擺 */
        .maid-body::before {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 40px;
            background: #1a1a1a;
            border-radius: 0 0 70px 70px;
        }

        /* 白色圍裙 */
        .apron {
            position: absolute;
            top: 135px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 80px;
            background: #fff;
            border-radius: 10px 10px 45px 45px;
            z-index: 4;
        }

        .apron::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 15px;
            background: #fff;
            border-radius: 5px 5px 0 0;
        }

        /* 愛心裝飾 */
        .heart-deco {
            position: absolute;
            top: 155px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            z-index: 5;
            animation: heartbeat 1s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); }
        }

        /* 手手 */
        .arm {
            position: absolute;
            top: 145px;
            width: 22px;
            height: 55px;
            background: linear-gradient(180deg, #FFD93D 0%, #F6C90C 100%);
            border-radius: 12px;
            z-index: 2;
        }

        .arm.left {
            left: 15px;
            transform-origin: top center;
            animation: waveLeft 0.5s ease-in-out infinite;
        }

        .arm.right {
            right: 15px;
            transform-origin: top center;
            animation: waveRight 0.5s ease-in-out infinite;
        }

        /* 白色袖口 */
        .arm::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 12px;
            background: #fff;
            border-radius: 5px;
        }

        @keyframes waveLeft {
            0%, 100% { transform: rotate(35deg); }
            50% { transform: rotate(-25deg); }
        }

        @keyframes waveRight {
            0%, 100% { transform: rotate(-35deg); }
            50% { transform: rotate(25deg); }
        }

        /* 腳腳 */
        .legs {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 1;
        }

        .leg {
            width: 28px;
            height: 30px;
            background: linear-gradient(180deg, #FFD93D 0%, #F6C90C 100%);
            border-radius: 10px 10px 12px 12px;
        }

        /* 跳舞動畫 */
        .dancing {
            animation: dance 0.5s ease-in-out infinite;
        }

        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            25% { transform: translateY(-12px) rotate(3deg); }
            50% { transform: translateY(0) rotate(-3deg); }
            75% { transform: translateY(-12px) rotate(3deg); }
        }

        /* 星星裝飾 */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            color: #FFD700;
            font-size: 24px;
            animation: twinkle 2s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }

        /* 音符裝飾 */
        .music-notes {
            position: absolute;
            font-size: 30px;
            animation: floatUp 3s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
        }

        /* 控制按鈕 */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-play {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-play:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.6);
        }

        .btn-stop {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-stop:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }

        .btn-stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 速度控制 */
        .speed-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .speed-control input {
            width: 150px;
            accent-color: #FF6B6B;
        }

        /* 派對彩帶 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* 地板 */
        .floor {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 25px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            border-radius: 50%;
            animation: shadow 0.5s ease-in-out infinite;
        }

        @keyframes shadow {
            0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.5; }
            50% { transform: translateX(-50%) scaleX(0.7); opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <h1>🎀 女僕奶龍跳舞派對 💃</h1>
    
    <div class="stage">
        <!-- 奶龍 -->
        <div class="nailong" id="nailong">
            <!-- 女僕帽 -->
            <div class="maid-hat"></div>
            
            <!-- 頭部 -->
            <div class="head">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
                <div class="nose"></div>
                <div class="mouth"></div>
            </div>
            
            <!-- 蝴蝶結 -->
            <div class="bowtie">
                <div class="bowtie-center"></div>
            </div>
            
            <!-- 女僕裝 -->
            <div class="maid-body"></div>
            <div class="apron"></div>
            <div class="heart-deco">❤️</div>
            
            <div class="arm left"></div>
            <div class="arm right"></div>
            
            <div class="legs">
                <div class="leg"></div>
                <div class="leg"></div>
            </div>
        </div>
        <div class="floor"></div>
    </div>

    <div class="controls">
        <button class="btn btn-play" id="playBtn" onclick="startDancing()">▶️ 開始跳舞</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopDancing()" disabled>⏸️ 暫停</button>
    </div>

    <div class="speed-control">
        <span>🐢 慢</span>
        <input type="range" id="speedSlider" min="0.2" max="2" step="0.1" value="1" onchange="changeSpeed(this.value)">
        <span>🐇 快</span>
    </div>

    <script>
        let isDancing = false;
        let noteInterval = null;

        // 創建星星
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starEmojis = ['⭐', '✨', '🌟', '💫', '🎀', '🦋'];
            
            for (let i = 0; i < 35; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = starEmojis[Math.floor(Math.random() * starEmojis.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.fontSize = (15 + Math.random() * 20) + 'px';
                starsContainer.appendChild(star);
            }
        }

        // 創建彩帶
        function createConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181', '#AA96DA', '#FFD93D', '#fff'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }
                
                document.body.appendChild(confetti);
            }
        }

        // 開始跳舞
        function startDancing() {
            isDancing = true;
            const nailong = document.getElementById('nailong');
            nailong.classList.add('dancing');
            
            document.getElementById('playBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            createMusicNotes();
            
            createConfetti();
        }

        // 停止跳舞
        function stopDancing() {
            isDancing = false;
            const nailong = document.getElementById('nailong');
            nailong.classList.remove('dancing');
            
            document.getElementById('playBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            if (noteInterval) {
                clearInterval(noteInterval);
                noteInterval = null;
            }
        }

        // 改變速度
        function changeSpeed(value) {
            const nailong = document.getElementById('nailong');
            const duration = 0.5 / value;
            
            nailong.style.animationDuration = duration + 's';
            
            const arms = document.querySelectorAll('.arm');
            arms.forEach(arm => {
                arm.style.animationDuration = duration + 's';
            });
        }

        // 創建音符
        function createMusicNotes() {
            if (noteInterval) clearInterval(noteInterval);
            
            const stage = document.querySelector('.stage');
            const notes = ['🎵', '🎶', '💃', '🕺', '✨', '🎀'];
            
            noteInterval = setInterval(() => {
                if (!isDancing) return;
                
                const note = document.createElement('span');
                note.className = 'music-notes';
                note.textContent = notes[Math.floor(Math.random() * notes.length)];
                note.style.left = (25 + Math.random() * 50) + '%';
                note.style.bottom = '80px';
                note.style.animation = `floatUp ${2 + Math.random()}s ease-out forwards`;
                stage.appendChild(note);
                
                setTimeout(() => note.remove(), 3000);
            }, 700);
        }

        // 初始化
        createStars();
    </script>
</body>
</html>
