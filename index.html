<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶龍跳舞 💃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        #canvas-container {
            position: relative;
        }

        #danceCanvas {
            display: block;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
        }

        .controls {
            margin-top: 50px;
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: #fff;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .speed-control {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .speed-control input {
            width: 120px;
            accent-color: #fff;
        }
    </style>
</head>
<body>
    <h1>奶龍 💃</h1>
    
    <div id="canvas-container">
        <canvas id="danceCanvas" width="400" height="500"></canvas>
    </div>

    <div class="controls">
        <button class="btn" id="stopBtn" onclick="stopDancing()">⏸ 暫停</button>
    </div>

    <div class="speed-control">
        <span>慢</span>
        <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" onchange="changeSpeed(this.value)">
        <span>快</span>
    </div>

    <script>
        // 奶龍圖片
        const nailongImg = new Image();
        nailongImg.src = 'nailong.png';
        
        const canvas = document.getElementById('danceCanvas');
        const ctx = canvas.getContext('2d');
        
        let isDancing = true;  // 預設開啟
        let time = 0;
        let speed = 1;
        let flipDirection = 1;
        
        // 動畫
        function animate() {
            time += 0.016;
            draw();
            requestAnimationFrame(animate);
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 30;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // 跳舞動畫 - 持續播放
            const bounce = Math.sin(time * 6 * speed) * 12;
            const sway = Math.sin(time * 3 * speed) * 6;
            const scaleX = 1 + Math.sin(time * 4 * speed) * 0.02;
            
            ctx.scale(scaleX * flipDirection, 1);
            ctx.translate(sway, bounce);
            
            // 週期性改變方向
            if (Math.sin(time * 2 * speed) > 0.95) {
                flipDirection *= -1;
            }
            
            // 發光效果
            ctx.shadowColor = 'rgba(255, 215, 0, 0.3)';
            ctx.shadowBlur = 20 + Math.sin(time * 5 * speed) * 10;
            
            // 繪製圖片
            if (nailongImg.complete) {
                ctx.drawImage(nailongImg, -130, -170, 260, 340);
            }
            
            ctx.restore();
        }
        
        function startDancing() {
            isDancing = true;
            speed = parseFloat(document.getElementById('speedSlider').value);
        }
        
        function stopDancing() {
            isDancing = false;
        }
        
        function changeSpeed(value) {
            speed = parseFloat(value);
        }
        
        // 初始化
        nailongImg.onload = draw;
        animate();
    </script>
</body>
</html>
